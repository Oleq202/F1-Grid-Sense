<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>F1 Race Predictor</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #0c0c10;
                --panel: #16161d;
                --panel-alt: #1c1c25;
                --red: #e10600;
                --red-dim: #7a0400;
                --text: #f5f5f7;
                --text-dim: #8b8b93;
                --border: #2a2a33;
                --green: #00d2a0;
                --off: #ff3b30;
            }

            * {
                box-sizing: border-box;
            }

            body {
                font-family: "Titillium Web", sans-serif;
                background: var(--bg);
                color: var(--text);
                max-width: 900px;
                margin: 0 auto;
                padding: 0 0 60px;
            }

            header.top {
                position: relative;
                margin: 0 -100vw 32px;
                padding: 0 100vw;
                background: linear-gradient(180deg, #17171f 0%, #0c0c10 100%);
                border-bottom: 1px solid var(--border);
                overflow: hidden;
            }

            header.top::before {
                content: "";
                position: absolute;
                top: 0;
                right: -10%;
                width: 140px;
                height: 100%;
                background: repeating-linear-gradient(
                    115deg,
                    var(--red) 0px,
                    var(--red) 18px,
                    transparent 18px,
                    transparent 30px
                );
                opacity: 0.9;
            }

            .top-inner {
                position: relative;
                padding: 28px 16px 22px;
                z-index: 1;
            }

            .eyebrow {
                display: inline-block;
                font-family: "JetBrains Mono", monospace;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--red);
                background: rgba(225, 6, 0, 0.12);
                border: 1px solid var(--red-dim);
                padding: 3px 8px;
                border-radius: 2px;
                margin-bottom: 10px;
            }

            h2 {
                margin: 0 0 6px;
                font-size: 30px;
                font-weight: 900;
                letter-spacing: 0.01em;
                text-transform: uppercase;
                line-height: 1.1;
            }

            header.top p {
                margin: 0;
                max-width: 60ch;
                color: var(--text-dim);
                font-size: 14px;
                line-height: 1.5;
            }

            .page-body {
                padding: 0 16px;
            }

            .controls {
                display: flex;
                gap: 10px;
                margin: 0 0 18px;
                padding: 14px;
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 4px;
            }

            select,
            button {
                padding: 10px 14px;
                font-size: 13px;
                font-family: "Titillium Web", sans-serif;
                font-weight: 600;
                border-radius: 2px;
                border: 1px solid var(--border);
            }

            select {
                flex: 1;
                background: var(--panel-alt);
                color: var(--text);
            }

            select:focus,
            button:focus-visible {
                outline: 2px solid var(--red);
                outline-offset: 1px;
            }

            button {
                cursor: pointer;
                background: var(--red);
                color: #fff;
                border: 1px solid var(--red);
                text-transform: uppercase;
                letter-spacing: 0.06em;
                transition: background 0.15s ease;
            }

            button:hover:not(:disabled) {
                background: #ff1b12;
            }

            button:disabled {
                cursor: not-allowed;
                opacity: 0.5;
                background: var(--red-dim);
                border-color: var(--red-dim);
            }

            #status {
                margin: 0 0 16px;
                font-family: "JetBrains Mono", monospace;
                font-size: 12.5px;
                color: var(--text-dim);
                min-height: 1.2em;
            }

            .table-wrap {
                border: 1px solid var(--border);
                border-radius: 4px;
            }

            table {
                width: 100%;
                border-collapse: separate;
                border-spacing: 0;
            }

            th,
            td {
                border-bottom: 1px solid var(--border);
                padding: 10px 12px;
                text-align: center;
                font-size: 13.5px;
            }

            td:first-child,
            th:first-child {
                text-align: left;
            }

            thead tr:first-child th:first-child {
                border-top-left-radius: 4px;
            }
            thead tr:first-child th:last-child {
                border-top-right-radius: 4px;
            }
            tbody tr:last-child td:first-child {
                border-bottom-left-radius: 4px;
            }
            tbody tr:last-child td:last-child {
                border-bottom-right-radius: 4px;
            }

            th {
                position: sticky;
                top: 0;
                z-index: 10;
                background: #1a1a22;
                color: var(--text);
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                font-size: 11.5px;
                white-space: nowrap;
                border-bottom: 2px solid var(--red);
                box-shadow: 0 6px 10px -6px rgba(0, 0, 0, 0.6);
            }

            tbody tr {
                background: var(--panel);
            }

            tbody tr:nth-child(even) {
                background: var(--panel-alt);
            }

            tbody tr:hover {
                background: #23232f;
            }

            tbody td {
                color: var(--text);
            }

            td:nth-child(3),
            td:nth-child(4),
            td:nth-child(5),
            td:nth-child(6) {
                font-family: "JetBrains Mono", monospace;
                font-weight: 500;
            }

            .delta-pos {
                color: var(--green);
                font-weight: 700;
            }

            .delta-neg {
                color: var(--off);
                font-weight: 700;
            }

            .delta-zero {
                color: var(--text-dim);
            }

            th.sortable {
                cursor: pointer;
                user-select: none;
            }

            th.sortable:hover {
                background: #24242e;
            }

            th.sortable .arrow {
                display: inline-block;
                width: 1em;
                opacity: 0.5;
                color: var(--red);
            }

            th.sortable.active {
                background: #2a2a35;
            }

            th.sortable.active .arrow {
                opacity: 1;
            }

            #metricsPanel {
                margin-top: 20px;
                padding: 16px 18px;
                background: var(--panel);
                border: 1px solid var(--border);
                border-left: 3px solid var(--red);
                border-radius: 4px;
                font-size: 14px;
            }

            #metricsPanel h3 {
                margin: 0 0 10px;
                font-size: 13px;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                font-weight: 700;
                color: var(--text-dim);
            }

            #metricsPanel table {
                margin-top: 0;
            }

            #metricsPanel th {
                position: static;
                box-shadow: none;
                border-bottom: 1px solid var(--border);
                background: transparent;
                color: var(--text-dim);
            }

            #metricsPanel td {
                background: transparent;
                border-bottom: 1px solid var(--border);
                font-family: "JetBrains Mono", monospace;
            }

            #metricsPanel td:first-child {
                font-family: "Titillium Web", sans-serif;
                font-weight: 600;
            }

            .metric-note {
                margin-top: 10px;
                color: var(--text-dim);
                font-size: 12px;
                line-height: 1.5;
            }
        </style>
    </head>
    <body>
        <header class="top">
            <div class="top-inner">
                <span class="eyebrow">Model Output</span>
                <h2>F1 Race Finish Predictor</h2>
                <p>
                    Pick a race. The model is trained only on races before it,
                    then predicts that race's order.
                </p>
            </div>
        </header>

        <div class="page-body">
            <div class="controls">
                <select id="raceSelect"></select>
                <button id="predictBtn" onclick="runPrediction()">
                    Predict
                </button>
            </div>

            <div id="status"></div>

            <div class="table-wrap">
                <table id="resultsTable" style="display: none">
                    <thead>
                        <tr>
                            <th
                                class="sortable"
                                data-key="Driver"
                                data-type="text"
                                onclick="sortBy('Driver', 'text')"
                            >
                                Driver <span class="arrow"></span>
                            </th>
                            <th
                                class="sortable"
                                data-key="TeamName"
                                data-type="text"
                                onclick="sortBy('TeamName', 'text')"
                            >
                                Team <span class="arrow"></span>
                            </th>
                            <th
                                class="sortable"
                                data-key="GridPosition"
                                data-type="number"
                                onclick="sortBy('GridPosition', 'number')"
                            >
                                Starting Grid <span class="arrow"></span>
                            </th>
                            <th
                                class="sortable"
                                data-key="PredictedPosition"
                                data-type="number"
                                onclick="sortBy('PredictedPosition', 'number')"
                            >
                                Predicted Finish <span class="arrow"></span>
                            </th>
                            <th
                                class="sortable"
                                data-key="RaceFinishPosition"
                                data-type="number"
                                onclick="sortBy('RaceFinishPosition', 'number')"
                            >
                                Actual Finish <span class="arrow"></span>
                            </th>
                            <th
                                class="sortable"
                                data-key="PositionDelta"
                                data-type="number"
                                onclick="sortBy('PositionDelta', 'number')"
                            >
                                Off By <span class="arrow"></span>
                            </th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div id="metricsPanel" style="display: none"></div>
        </div>

        <script>
            const API_BASE = "";

            let currentData = [];
            let sortState = {
                key: "GridPosition",
                type: "number",
                direction: "asc",
            };
            let raceLookup = {};

            async function loadRaces() {
                const status = document.getElementById("status");
                const select = document.getElementById("raceSelect");
                try {
                    const res = await fetch(`${API_BASE}/races`);
                    if (!res.ok)
                        throw new Error(`Failed to load races (${res.status})`);
                    const races = await res.json();

                    select.innerHTML = "";
                    raceLookup = {};
                    races.forEach((r) => {
                        const key = `${r.Year}|${r.RoundNumber}`;
                        raceLookup[key] = r.Circuit;
                        const opt = document.createElement("option");
                        opt.value = key;
                        opt.textContent = `${r.Year} - Round ${r.RoundNumber} (${r.Circuit})`;
                        select.appendChild(opt);
                    });
                    status.textContent = `Loaded ${races.length} selectable races (2019+).`;
                } catch (err) {
                    status.textContent = `Error loading races: ${err.message}. Is the API running at ${API_BASE}?`;
                }
            }

            function deltaClass(delta) {
                if (delta > 0) return "delta-neg";
                if (delta < 0) return "delta-pos";
                return "delta-zero";
            }

            function formatDelta(delta) {
                if (delta === 0) return "0";
                return delta > 0 ? `+${delta}` : `${delta}`;
            }

            function sortBy(key, type) {
                if (sortState.key === key) {
                    sortState.direction =
                        sortState.direction === "asc" ? "desc" : "asc";
                } else {
                    sortState = { key, type, direction: "asc" };
                }
                renderTable();
            }

            function renderTable() {
                const { key, type, direction } = sortState;
                const sorted = [...currentData].sort((a, b) => {
                    let cmp;
                    if (type === "text") {
                        cmp = String(a[key]).localeCompare(String(b[key]));
                    } else {
                        cmp = a[key] - b[key];
                    }
                    return direction === "asc" ? cmp : -cmp;
                });

                const tbody = document.querySelector("#resultsTable tbody");
                tbody.innerHTML = "";
                sorted.forEach((row) => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
          <td>${row.Driver}</td>
          <td>${row.TeamName}</td>
          <td>${row.GridPosition}</td>
          <td>${row.PredictedPosition}</td>
          <td>${row.RaceFinishPosition}</td>
          <td class="${deltaClass(row.PositionDelta)}">${formatDelta(row.PositionDelta)}</td>
        `;
                    tbody.appendChild(tr);
                });

                document.querySelectorAll("th.sortable").forEach((th) => {
                    th.classList.remove("active");
                    th.querySelector(".arrow").textContent = "";
                });
                const activeTh = document.querySelector(
                    `th.sortable[data-key="${key}"]`,
                );
                if (activeTh) {
                    activeTh.classList.add("active");
                    activeTh.querySelector(".arrow").textContent =
                        direction === "asc" ? "▲" : "▼";
                }
            }

            function renderMetrics(metrics) {
                const panel = document.getElementById("metricsPanel");
                const fmt = (v) => (v === null || v === undefined ? "—" : v);

                panel.innerHTML = `
        <h3>Model accuracy for this race</h3>
        <table>
          <thead>
            <tr><th></th><th>Spearman rank corr.</th><th>Mean abs. error (positions)</th></tr>
          </thead>
          <tbody>
            <tr><td>Model</td><td>${fmt(metrics.spearman)}</td><td>${fmt(metrics.mae)}</td></tr>
            <tr><td>Naive (grid order)</td><td>${fmt(metrics.naive_grid_spearman)}</td><td>${fmt(metrics.naive_grid_mae)}</td></tr>
          </tbody>
        </table>
        <div class="metric-note">
          Spearman: 1.0 = predicted order exactly matches actual order, 0 = no better than random.
          MAE: average number of positions the prediction was off by. "Naive" just assumes everyone
          finishes where they started on the grid — the model should beat it to be worth anything.
        </div>
      `;
                panel.style.display = "";
            }

            async function runPrediction() {
                const [yearStr, roundStr] = document
                    .getElementById("raceSelect")
                    .value.split("|");
                const year = Number(yearStr);
                const round_number = Number(roundStr);

                const status = document.getElementById("status");
                const table = document.getElementById("resultsTable");
                const btn = document.getElementById("predictBtn");
                const metricsPanel = document.getElementById("metricsPanel");

                btn.disabled = true;
                status.textContent =
                    "Training on prior races and predicting...";
                table.style.display = "none";
                metricsPanel.style.display = "none";

                try {
                    const res = await fetch(
                        `${API_BASE}/predict?year=${year}&round_number=${round_number}`,
                    );
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({}));
                        throw new Error(
                            err.detail || `Request failed (${res.status})`,
                        );
                    }
                    const payload = await res.json();
                    currentData = payload.results;
                    sortState = {
                        key: "GridPosition",
                        type: "number",
                        direction: "asc",
                    };
                    renderTable();
                    renderMetrics(payload.metrics);

                    table.style.display = "";
                    const circuit =
                        raceLookup[`${year}|${round_number}`] ||
                        `Round ${round_number}`;
                    status.textContent = `Predicted ${year} - ${circuit}.`;
                } catch (err) {
                    status.textContent = `Error: ${err.message}`;
                } finally {
                    btn.disabled = false;
                }
            }

            loadRaces();
        </script>
    </body>
</html>
