services:
    - type: web
      name: f1-predictor-api
      env: python
      buildCommand: pip install -r requirements.txt
      startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
      envVars:
          - key: PYTHON_VERSION
            value: 3.11

    - type: cron
      name: f1-qualifying-scraper
      env: python
      buildCommand: pip install -r requirements.txt
      startCommand: python src/scrape_qualifying.py
      schedule: "0 20 * * 6"
      envVars:
          - key: PYTHON_VERSION
            value: 3.11

    - type: cron
      name: f1-race-updater
      env: python
      buildCommand: pip install -r requirements.txt
      startCommand: python src/update_race_results.py
      schedule: "0 18 * * 0"
      envVars:
          - key: PYTHON_VERSION
            value: 3.11
